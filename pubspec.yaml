name: alquran_app
description: "Aplikasi Al-Qur'an Indonesia Modern dengan Terjemahan, Audio Murottal, dan Tafsir Kemenag RI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  just_audio: ^0.9.40
  google_fonts: ^6.2.1
  intl: ^0.19.0
  adhan_dart: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
