name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Gradle Wrapper
        run: |
          flutter create . --platforms=android --org com.alldi
          # Remove any generated .kts files to avoid conflict with Groovy .gradle files
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          # Ensure Gradle 8.14 is set in wrapper
          sed -i 's/gradle-.*-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-.*-bin.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          set -o pipefail
          if ! flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build_output.log; then
            echo "### ❌ Build APK Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlQuran-Indonesia-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-v1.0.${{ github.run_number }}
          name: Al-Qur'an Indonesia APK v1.0.${{ github.run_number }}
          body: |
            ### 📱 Download APK Al-Qur'an Indonesia Terbaru
            - ✅ Donasi aktif: GoPay & ShopeePay a.n Ahmad Aldi Putera (085691430408)
            - ✅ Kompas Kiblat: Perhitungan akurat + Pemilih Kota langsung di layar kiblat
            - ✅ Al-Qur'an 114 Surah, Tajwid Berwarna, Tafsir Kemenag RI, dan Audio Murottal
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
