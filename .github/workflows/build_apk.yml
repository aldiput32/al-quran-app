name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Gradle Wrapper
        run: |
          flutter create . --platforms=android --org com.alldi
          chmod +x android/gradlew

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: |
          set -o pipefail
          if ! flutter build apk --release 2>&1 | tee build_output.log; then
            echo "### ❌ Build APK Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlQuran-Indonesia-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
